{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg" style="border-radius: 15px;">
            <div class="card-body p-5">
                <h3 class="fw-bold text-primary text-center mb-4">Yeni Üye Kaydı</h3>
                
                <form method="POST" action="/auth_register_new">
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-posta Adresi</label>
                        <input type="email" name="email" class="form-control" placeholder="ornek@firma.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Şifre</label>
                        <input type="password" name="password" class="form-control" placeholder="******" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Firma / Şahıs Adı</label>
                        <input type="text" name="company_name" class="form-control" placeholder="Firma adınız">
                    </div>

                    <hr class="my-4">

                    <div class="mb-4 bg-light p-3 rounded border border-primary">
                        <label class="fw-bold text-primary">🛡️ Güvenlik Kontrolü: 2 + 3 kaç eder?</label>
                        <input type="number" name="robot_kontrol" class="form-control mt-2" placeholder="Cevabı buraya yazın" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fas fa-user-plus me-2"></i>Hesap Oluştur ve Başla
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">Zaten hesabınız var mı? Giriş yapın</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
