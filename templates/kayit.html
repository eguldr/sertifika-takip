{% extends 'base.html' %}

{% block content %}
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="text-center mb-4">
            <i class="fas fa-certificate fa-3x text-primary shadow-sm p-3 bg-white rounded-circle"></i>
            <h3 class="mt-2 fw-bold text-primary">SertifikaTakip</h3>
            <p class="text-muted small">Dijital Risk Yönetim Sistemi</p>
        </div>
        
        <div class="card border-0 shadow-lg" style="border-radius: 15px;">
            <div class="card-body p-4">
                <h5 class="mb-4 fw-bold text-navy"><i class="fas fa-user-plus me-2"></i>Hesap Oluştur</h5>
                
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Firma / Kurum Adı</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-building text-muted"></i></span>
                            <input type="text" name="company_name" class="form-control border-start-0" placeholder="Örn: ADEA Danışmanlık" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">E-posta Adresi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control border-start-0" placeholder="ornek@mail.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Şifre</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="******" required>
                        </div>
                    </div>

                    <div class="mb-4 d-flex justify-content-center">
                        <div class="g-recaptcha" data-sitekey="6Leewb8sAAAAAG-fOE4VY7aYZ1T-S_1H21ckRpsO" data-callback="verifyCallback"></div>
                    </div>

                    <button type="submit" id="regBtn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fas fa-paper-plane me-2"></i>Kayıt Ol ve Aktivasyon Gönder
                    </button>
                </form>

                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0 text-muted">Zaten hesabınız var mı? 
                        <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Giriş Yap</a>
                    </p>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4 text-muted">
            <small>&copy; 2026 EG Optimal | Mevzuat ve Risk Yönetimi</small>
        </div>
    </div>
</div>

<style>
    /* Kurumsal Navy Rengi */
    .text-navy { color: #1a1c4b; }
    
    /* Input odaklanma efekti */
    .form-control:focus {
        border-color: #1a1c4b;
        box-shadow: 0 0 0 0.25rem rgba(26, 28, 75, 0.1);
    }

    /* reCAPTCHA Mobil Uyumluluk */
    @media (max-width: 400px) {
        .g-recaptcha {
            transform: scale(0.85);
            transform-origin: 0 0;
        }
    }
    
    .btn-primary {
        background-color: #1a1c4b;
        border: none;
        transition: 0.3s;
    }
    
    .btn-primary:hover {
        background-color: #c5a059; /* EG Gold rengi */
        transform: translateY(-2px);
    }
</style>

<script>
    // reCAPTCHA seçilmeden butonun pasif kalması için (Opsiyonel Güvenlik)
    /*
    document.getElementById('regBtn').disabled = true;
    function verifyCallback() {
        document.getElementById('regBtn').disabled = false;
    }
    */
</script>

{% endblock %}
