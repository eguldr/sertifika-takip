{% extends "base.html" %}
{% block content %}
<h2>Yeni Kayıt Ekle</h2>
<div class="card p-4 shadow-sm">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Kategori</label>
            <select name="category" class="form-select" required>
                <option value="Urun" {% if request.args.get('cat') == 'Urun' %}selected{% endif %}>🏭 Üretim & Ürün</option>
                <option value="Arac" {% if request.args.get('cat') == 'Arac' %}selected{% endif %}>🚚 Araç & Filo</option>
                <option value="Personel" {% if request.args.get('cat') == 'Personel' %}selected{% endif %}>👥 Personel & SRC</option>
                <option value="Tesis" {% if request.args.get('cat') == 'Tesis' %}selected{% endif %}>🏢 Tesis & Mekan</option>
            </select>
        </div>
<div class="mb-3">
    <label class="form-label">Sertifika / Belge Seçin</label>
    <select name="title" class="form-select" required>
        <option value="">-- Bir Sertifika Seçin --</option>
        <optgroup label="Ticaret Bakanlığı Destekleri">
            <option value="Küresel Tedarik Zinciri">Küresel Tedarik Zinciri (KTZ)</option>
            <option value="Birim Marka Tescil">Birim Marka Tescil</option>
            <option value="Pazara Giriş Belgesi">Pazara Giriş Belgesi</option>
        </optgroup>
        <optgroup label="Diğer Belgeler">
            <option value="Kapasite Raporu">Kapasite Raporu</option>
            <option value="ISO 9001">ISO 9001</option>
            <option value="CE Belgesi">CE Belgesi</option>
            <option value="Yerli Malı Belgesi">Yerli Malı Belgesi</option>
        </optgroup>
    </select>
</div>    
</div>
        <div class="mb-3">
    <label class="form-label">Başlangıç Tarihi (Bakanlık Teşvik Takibi İçin)</label>
    <input type="date" name="start_date" class="form-control" required>
</div>
        <div class="mb-3">
            <label class="form-label">Bitiş Tarihi</label>
            <input type="date" name="expiry_date" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Sisteme Kaydet</button>
    </form>
</div>
{% endblock %}
