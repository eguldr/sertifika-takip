{% block content %}
<div class="card shadow border-0">

        <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Yeni Kayıt Ekle (v4 Tam Sürüm)</h4>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="/ekle">

                <label class="form-label fw-bold text-success"><i class="fab fa-whatsapp me-1"></i> WhatsApp Numarası (Hatırlatma İçin)</label>

            </div>

            {% if request.args.get('cat') == 'Arac' %}

                <label class="form-label fw-bold">Araç Tipi</label>

                    <option value="">-- Seçiniz --</option>
                    <option value="binek">🚗 Binek Otomobil</option>
                    <option value="ticari_hafif">🚐 Hafif Ticari</option>
                    <option value="ticari_agir">🚛 Ağır Ticari</option>
                </select>
            </div>
            <div id="aracBelgeDiv" style="display:none;">
                <label class="form-label fw-bold">İşlem / Belge Türü</label>
                <select name="title" id="aracSelect" class="form-select shadow-sm" onchange="checkDiger(this)">
                    <option value="">-- Seçiniz --</option>

            {% elif request.args.get('cat') == 'Tesis' %}

                <label class="form-label fw-bold">Tesis Belgesi Seçin</label>

                    <option value="" disabled selected>-- Seçiniz --</option>
                    <option>Sanayi Sicil Belgesi</option>
                    <option>Yıllık İşletme Cetveli</option>
                    <option>İtfaiye Uygunluk Raporu</option>
                    <option>Kapasite Raporu</option>
                    <option>İşyeri Açma ve Çalışma Ruhsatı</option>
                    <option>Emisyon Ölçümü</option>
                    <option value="Diger">➕ LİSTEDE YOK</option>
                </select>
            </div>

            {% elif request.args.get('cat') == 'Personel' %}

                <label class="form-label fw-bold">Personel Belgesi Seçin</label>

                    <option value="" disabled selected>-- Seçiniz --</option>
                    <option>SRC 1-2-3-4 Belgesi</option>
                    <option>Psikoteknik Belgesi</option>

            <div class="mb-4">
                <label class="form-label fw-bold text-danger">Bitiş Tarihi</label>
                <input type="date" name="expiry_date" id="expiry_date" class="form-control border-danger shadow-sm" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 shadow">Verileri Kaydet ve Takibe Al</button>

<script>
// "Listede Yok" seçilince kutu açan kontrol
function checkDiger(sel) {
    const div = document.getElementById('otherInputDiv');
    const inp = document.getElementById('otherTitleInput');
    if (sel.value === 'Diger') {
        div.style.display = 'block';
        inp.required = true;
        inp.name = 'title';
        sel.removeAttribute('name');
    } else {
        div.style.display = 'none';
        inp.required = false;
        inp.removeAttribute('name');
        sel.name = 'title';
        otomatikTarih(sel.value);
    }
}

// Otomatik Tarih Hesaplama
const sureler = {
    'Araç Muayenesi': 365, 'Trafik Sigortası': 365, 'Kasko': 365,
    'Sanayi Sicil Belgesi': 730, 'Yıllık İşletme Cetveli': 120,
    'Kış Lastiği Değişimi': 180, 'Yaz Lastiği Değişimi': 180
};

function otomatikTarih(val) {
    const t = document.getElementById('expiry_date');
    if (!t || !val) return;
    const gun = sureler[val] || 365;
    const d = new Date();
    d.setDate(d.getDate() + gun);
    t.value = d.toISOString().split('T')[0];
}

// Araç Belge Listeleri
const aracBelgeleri = {
    binek: ['Araç Muayenesi', 'Trafik Sigortası', 'Kasko (İhtiyari Mali Mesuliyet)', 'Egzoz Emisyon Ölçümü', 'Kış Lastiği Değişimi', 'Yaz Lastiği Değişimi'],
    ticari_hafif: ['Araç Muayenesi', 'Trafik Sigortası', 'K2 Yetki Belgesi', 'Kış Lastiği Değişimi', 'Yaz Lastiği Değişimi'],
    ticari_agir: ['Araç Muayenesi', 'Trafik Sigortası', 'Takoğraf Kalibrasyonu', 'Kış Lastiği Değişimi', 'Yaz Lastiği Değişimi']
};

function aracTipiDegisti(sel) {
    const div = document.getElementById('aracBelgeDiv');
    const s = document.getElementById('aracSelect');
    div.style.display = sel.value ? 'block' : 'none';
    s.innerHTML = '<option value="">-- Seçiniz --</option>';
    if(sel.value) {
        aracBelgeleri[sel.value].forEach(b => {
            let o = document.createElement('option'); o.value=b; o.text=b; s.appendChild(o);
        });
        let d = document.createElement('option'); d.value='Diger'; d.text='➕ LİSTEDE YOK'; s.appendChild(d);
    }
}

// Arama Motoru
document.getElementById('searchInput')?.addEventListener('input', function() {
    const f = this.value.toUpperCase();
    document.getElementById('sertifikaSelect').querySelectorAll('option').forEach(o => {
        o.style.display = o.text.toUpperCase().includes(f) ? '' : 'none';
    });
});
</script>
