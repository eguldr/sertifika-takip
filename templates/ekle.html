<div class="mb-3">
    <label class="form-label">Sertifika / Belge Seçin</label>
    <select name="title" id="sertifikaSelect" class="form-select" onchange="toggleOther(this)" required>
        <option value="">-- Bir Belge Seçin --</option>
        
        <optgroup label="Sık Kullanılan Belgeler">
            <option value="CE İŞARETİ">CE İŞARETİ [cite: 28]</option>
            <option value="ISO 9001:2015">ISO 9001:2015 [cite: 104]</option>
            <option value="HELAL BELGESİ">HELAL BELGESİ [cite: 92]</option>
            <option value="EAC GÜMRÜK BİRLİĞİ">EAC GÜMRÜK BİRLİĞİ [cite: 42, 43]</option>
        </optgroup>

        <optgroup label="Sektörel Belgeler [cite: 15, 86, 120]">
            <option value="ATEX SERTİFİKASI">ATEX SERTİFİKASI [cite: 15]</option>
            <option value="GMP SERTİFİKASI">GMP SERTİFİKASI [cite: 86]</option>
            <option value="MDR TIBBİ CİHAZ">MDR TIBBİ CİHAZ [cite: 120]</option>
            <option value="UKCA İŞARETİ">UKCA İŞARETİ [cite: 174]</option>
        </optgroup>

        <option value="Diger" style="color: blue; font-weight: bold;">➕ LİSTEDE YOK (KENDİM YAZACAĞIM)</option>
    </select>
</div>

<div id="otherInputDiv" class="mb-3" style="display:none;">
    <label class="form-label text-primary">Belge / Sertifika Adını Yazın</label>
    <input type="text" id="otherTitleInput" class="form-control border-primary" placeholder="Örn: ÖZEL PAZAR BELGESİ">
</div>

<script>
function toggleOther(selectElement) {
    const otherDiv = document.getElementById('otherInputDiv');
    const otherInput = document.getElementById('otherTitleInput');
    
    if (selectElement.value === 'Diger') {
        otherDiv.style.display = 'block';
        otherInput.required = true;
        otherInput.name = 'title'; // Sunucuya bu ismi gönder
        selectElement.name = '';   // Select değerini gönderme
    } else {
        otherDiv.style.display = 'none';
        otherInput.required = false;
        otherInput.name = '';
        selectElement.name = 'title'; // Sunucuya seçilen değeri gönder
    }
}
</script>
