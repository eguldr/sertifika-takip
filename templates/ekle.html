{% extends "base.html" %}
{% block content %}
<h4>Yeni Kayıt Ekle</h4>
<form method="POST" action="/ekle">
    <input type="hidden" name="category" value="{{ request.args.get('cat', '') }}">

    {% if request.args.get('cat') == 'Arac' %}

    <!-- ARAÇ FORMU -->
    <div class="mb-3">
        <label class="form-label">Araç Tipi</label>
        <select id="aracTipi" class="form-select" onchange="aracTipiDegisti(this)">
            <option value="">-- Önce araç tipini seçin --</option>
            <option value="binek">🚗 Binek Otomobil</option>
            <option value="ticari_hafif">🚐 Hafif Ticari (Minibüs/Kamyonet ≤3.5t)</option>
            <option value="ticari_agir">🚛 Ağır Ticari (Kamyon/TIR >3.5t)</option>
        </select>
    </div>

    <div id="aracBelgeDiv" style="display:none;">
        <div id="uyariKutusu" class="alert alert-warning" style="display:none;"></div>

        <div class="mb-3">
            <label class="form-label">Belge / İşlem Türü</label>
            <select name="title" id="aracSelect" class="form-select" onchange="aracSecimDegisti(this)" required>
                <option value="">-- Seçiniz --</option>
            </select>
        </div>

        <div id="aracDigerDiv" class="mb-3" style="display:none;">
            <label class="form-label text-primary">Belge Adını Yazın</label>
            <input type="text" id="aracDigerInput" class="form-control border-primary">
        </div>

        <div class="mb-3">
            <label class="form-label">Plaka / Araç Adı</label>
            <input type="text" name="risk_value" class="form-control" placeholder="Örn: 34 ABC 123">
        </div>

        <div id="belgeBilgiNotu" class="alert alert-info" style="display:none;"></div>

        <div class="mb-3">
            <label class="form-label">Bitiş Tarihi</label>
            <input type="date" name="expiry_date" class="form-control" required>
        </div>
    </div>

    {% else %}

    <!-- SERTİFİKA FORMU -->
    <div class="mb-3">
        <label class="form-label">Sertifika / Belge Seçin</label>
        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Belge adını yazın (örn: CE, ISO, HELAL...)">
        <select name="title" id="sertifikaSelect" class="form-select" size="8" required>
            <option value="">-- Yukarıya yazarak arayın --</option>
            <option>ACS (Sağlık Uygunluk Sertifikası)</option>
            <option>ADR SERTİFİKALARI</option>
            <option>AS/EN/JISQ 9100</option>
            <option>ATEX SERTİFİKASI</option>
            <option>BASEC SERTİFİKASI</option>
            <option>BENOR SERTİFİKASI</option>
            <option>BRC SERTİFİKASI</option>
            <option>CALIBRATION SERTİFİKASI</option>
            <option>CARB SERTİFİKASI</option>
            <option>CB SERTİFİKASI</option>
            <option>CCC SERTİFİKASI</option>
            <option>CE İŞARETİ</option>
            <option>CEKAL SERTİFİKASI</option>
            <option>CLASS SERTİFİKASI</option>
            <option>CMIM UYGUNLUK İŞARETİ</option>
            <option>CMMIDEV SERTİFİKASI</option>
            <option>COSMOS SERTİFİKASI</option>
            <option>CRASH TEST SERTİFİKASI</option>
            <option>CRADLE TO CRADLE SERTİFİKASI</option>
            <option>CTUV İŞARETİ</option>
            <option>DIN SERİSİ BELGELER</option>
            <option>EAC GÜMRÜK BİRLİĞİ SERTİFİKASI</option>
            <option>ECE YÖNETMELİKLERİ SERTİFİKASI</option>
            <option>EC TYPE EXAMINATION SERTİFİKASI</option>
            <option>ECM SERTİFİKASI</option>
            <option>ECOLABEL SERTİFİKASI</option>
            <option>ECOCERT SERTİFİKASI</option>
            <option>EHEDG SERTİFİKASI</option>
            <option>EMC SERTİFİKASI</option>
            <option>EN SERİSİ SERTİFİKALAR</option>
            <option>ENPLUS SERTİFİKASI</option>
            <option>ETA (Avrupa Teknik Değerlendirmesi)</option>
            <option>EU TYPE EXAMINATION SERTİFİKASI</option>
            <option>EUCERTPLAST SERTİFİKASI</option>
            <option>EUROVENT SERTİFİKASI</option>
            <option>F4 STAR BELGESİ</option>
            <option>FAMI-QS SERTİFİKASI</option>
            <option>FIBC TEST SERTİFİKASI</option>
            <option>FM APPROVALS</option>
            <option>FSSC 22000 SERTİFİKASI</option>
            <option>G MARK SERTİFİKASI</option>
            <option>GASTEC QA SERTİFİKASI</option>
            <option>GERMAN ECOLABEL - BLUE ANGEL</option>
            <option>GMP SERTİFİKASI</option>
            <option>GMP+ FSA SERTİFİKASI</option>
            <option>GDP SERTİFİKASI</option>
            <option>GS SERTİFİKASI</option>
            <option>HACCP SERTİFİKASI</option>
            <option>HAR BELGESİ</option>
            <option>HELAL BELGESİ</option>
            <option>HİJYEN SERTİFİKASI</option>
            <option>INDOOR AIR QUALITY</option>

            <option>ISCC SERTİFİKASI</option>
            <option>ISO 9001:2015</option>
            <option>ISO 14001</option>
            <option>ISO 22000</option>
            <option>ISO 27001</option>
            <option>ISO 45001</option>
            <option>ISO 50001</option>
            <option>ISO 13485</option>
            <option>ISO 17025</option>
            <option>ISO 22301</option>
            <option>ISO 37001</option>
            <option>İYİ TARIM UYGULAMALARI</option>
            <option>JIS SERTİFİKASI</option>
            <option>KEMA KEUR / DEKRA SERTİFİKASI</option>
            <option>KEYMARK SERTİFİKASI</option>
            <option>KITEMARK SERTİFİKASI</option>
            <option>KTW-UBA UYGUNLUK BEYANI</option>

            <option>Q-MARK SERTİFİKASI</option>
            <option>RAL SERTİFİKASI</option>
            <option>RTN SERTİFİKASI</option>
            <option>SA8000 SOSYAL UYGUNLUK SERTİFİKASI</option>
            <option>SAFETY INTEGRITY LEVEL (SIL)</option>
            <option>SOLAR KEYMARK</option>
            <option>STANDARDSMARK</option>
            <option>TEKNİK REGLAMENT SERTİFİKASI</option>
            <option>TOXPROOF SERTİFİKASI</option>
            <option>TSI SERTİFİKASI</option>
            <option>TYPE APPROVAL SERTİFİKASI</option>
            <option>TYPE TEST SERTİFİKASI</option>
            <option>UKCA İŞARETİ</option>
            <option>UKRSEPRO SERTİFİKASI</option>
            <option>UL SERTİFİKASI</option>
            <option>UYGUNLUK SERTİFİKASI</option>
            <option>VDE SERTİFİKASI</option>
            <option>VDI 2700 SERTİFİKASI</option>
            <option>WRAS SERTİFİKASI</option>
            <option>WATERMARK SERTİFİKASI</option>
            <option>YANGIN SERTİFİKASI</option>
            <option value="Diger">➕ LİSTEDE YOK (KENDİM YAZACAĞIM)</option>
        </select>
    </div>

    <div id="otherInputDiv" class="mb-3" style="display:none;">
        <label class="form-label text-primary">Belge / Sertifika Adını Yazın</label>
        <input type="text" id="otherTitleInput" class="form-control border-primary" placeholder="Örn: ÖZEL PAZAR BELGESİ">
    </div>

    <div class="mb-3">
        <label class="form-label">Bitiş Tarihi</label>
        <input type="date" name="expiry_date" class="form-control" required>
    </div>

    {% endif %}

    <button type="submit" class="btn btn-primary">Kaydet</button>
    <a href="/sertifikalar?cat={{ request.args.get('cat', '') }}" class="btn btn-secondary ms-2">İptal</a>
</form>

<script>
const aracBelgeleri = {
    binek: [
        {grup: 'Zorunlu', belgeler: ['Araç Muayenesi', 'Trafik Sigortası (Zorunlu)']},
        {grup: 'İsteğe Bağlı', belgeler: ['Kasko', 'Egzoz Muayenesi', 'Araç Ruhsatı Yenileme']}
    ],
    ticari_hafif: [
        {grup: 'Zorunlu', belgeler: ['Araç Muayenesi', 'Trafik Sigortası (Zorunlu)', 'K2 Yetki Belgesi']},
        {grup: 'İsteğe Bağlı', belgeler: ['Kasko', 'Egzoz Muayenesi', 'Takoğraf Kalibrasyonu', 'Araç Ruhsatı Yenileme', 'Lastik Değişimi']}
    ],
    ticari_agir: [
        {grup: 'Zorunlu', belgeler: ['Araç Muayenesi', 'Trafik Sigortası (Zorunlu)', 'K2 Yetki Belgesi', 'Takoğraf Kalibrasyonu', 'ADR Uygunluk Belgesi']},
        {grup: 'İsteğe Bağlı', belgeler: ['Kasko', 'Egzoz Muayenesi', 'Araç Ruhsatı Yenileme']}
    ]
};

const uyarilar = {
    binek: '⚠️ <strong>Binek Araç Muayene Cezaları (2026):</strong><br>• Trafikte muayenesiz yakalanma: <strong>2.719 TL</strong> (15 günde ödenirse %25 indirimle 2.039 TL)<br>• Her gecikilen ay için muayene ücretine <strong>%5 gecikme faizi</strong> eklenir<br>• Ruhsatta belirtilen tarihten 1 gün sonra bile %5 faiz işler<br>• 7 gün süre verilir, muayene yapılmazsa araç <strong>trafikten men</strong> edilir',
    ticari_hafif: '⚠️ <strong>Hafif Ticari Araç Cezaları (2026):</strong><br>• Muayenesiz trafikte: <strong>2.719 TL</strong> + araç men<br>• Her gecikilen ay: muayene ücretine <strong>%5 faiz</strong><br>• <strong>K2 olmadan faaliyet: 21.333 TL</strong><br>• Araç K2\'ye kaydedilmezse: <strong>10.666 TL</strong>',
    ticari_agir: '⚠️ <strong>Ağır Ticari Araç Cezaları (2026):</strong><br>• Muayenesiz: <strong>115.021 TL</strong> (1.) / 191.867 TL (2.) / 383.842 TL (3.)<br>• <strong>K2 olmadan faaliyet: 21.333 TL</strong><br>• Araç K2\'ye kaydedilmezse: <strong>10.666 TL</strong><br>• Takoğraf eksikliği: ağır ceza'
};

const belgeBilgileri = {
    'K2 Yetki Belgesi': 'ℹ️ <strong>K2 Yetki Belgesi:</strong> 5 yıl geçerlidir. 90 gün öncesinden yenileme süreci başlar. Süre bitiminden 540 gün içinde başvurulmazsa belge <strong>iptal</strong> olur. Yeni alınan araçlar 15 gün içinde belgeye eklenmelidir.',
    'Araç Muayenesi': '🔧 <strong>Araç Muayenesi:</strong> Ruhsatta belirtilen tarihten 1 gün bile gecikse %5 faiz işlemeye başlar. Trafikte yakalanırsa 2.719 TL ceza + araç men riski.',
    'Takoğraf Kalibrasyonu': '⏱️ <strong>Takoğraf:</strong> 2 yılda bir kalibrasyon zorunludur. Eksik veya manipüle takoğraf ağır cezaya yol açar.',
    'Trafik Sigortası (Zorunlu)': '🛡️ <strong>Zorunlu Trafik Sigortası:</strong> Sigortasız araçla trafiğe çıkmak hem para cezasına hem de aracın trafikten men edilmesine neden olur.',
    'ADR Uygunluk Belgesi': '☢️ <strong>ADR:</strong> Tehlikeli madde taşıyan araçlar için zorunludur. Eksikliği halinde ağır idari para cezası uygulanır.'
};

function aracTipiDegisti(sel) {
    if (!sel.value) {
        document.getElementById('aracBelgeDiv').style.display = 'none';
        return;
    }
    document.getElementById('aracBelgeDiv').style.display = 'block';

    const uyariKutusu = document.getElementById('uyariKutusu');
    uyariKutusu.innerHTML = uyarilar[sel.value];
    uyariKutusu.style.display = 'block';

    const aracSelect = document.getElementById('aracSelect');
    aracSelect.innerHTML = '<option value="">-- Seçiniz --</option>';
    aracBelgeleri[sel.value].forEach(grup => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = grup.grup;
        grup.belgeler.forEach(belge => {
            const opt = document.createElement('option');
            opt.value = belge;
            opt.text = belge;
            optgroup.appendChild(opt);
        });
        aracSelect.appendChild(optgroup);
    });
    const digerOpt = document.createElement('option');
    digerOpt.value = 'Diger';
    digerOpt.text = '➕ Listede Yok';
    aracSelect.appendChild(digerOpt);

    document.getElementById('belgeBilgiNotu').style.display = 'none';
    document.getElementById('aracDigerDiv').style.display = 'none';
}

function aracSecimDegisti(sel) {
    const bilgiNotu = document.getElementById('belgeBilgiNotu');
    const digerDiv = document.getElementById('aracDigerDiv');
    const digerInput = document.getElementById('aracDigerInput');

    digerDiv.style.display = 'none';
    bilgiNotu.style.display = 'none';

    if (sel.value === 'Diger') {
        digerDiv.style.display = 'block';
        digerInput.name = 'title';
        sel.name = '';
    } else {
        sel.name = 'title';
        digerInput.name = '';
        if (belgeBilgileri[sel.value]) {
            bilgiNotu.innerHTML = belgeBilgileri[sel.value];
            bilgiNotu.style.display = 'block';
        }
    }
}

const searchInput = document.getElementById('searchInput');
if (searchInput) {
    searchInput.addEventListener('input', function() {
        const filter = this.value.toUpperCase();
        document.getElementById('sertifikaSelect').querySelectorAll('option').forEach(opt => {
            if (opt.value === '' || opt.value === 'Diger') opt.style.display = '';
            else if (opt.text.toUpperCase().includes(filter)) opt.style.display = '';
            else opt.style.display = 'none';
        });
    });
}

const sertifikaSelect = document.getElementById('sertifikaSelect');
if (sertifikaSelect) {
    sertifikaSelect.addEventListener('change', function() {
        const otherDiv = document.getElementById('otherInputDiv');
        const otherInput = document.getElementById('otherTitleInput');
        if (this.value === 'Diger') {
            otherDiv.style.display = 'block';
            otherInput.required = true;
            otherInput.name = 'title';
            this.name = '';
        } else {
            otherDiv.style.display = 'none';
            otherInput.required = false;
            otherInput.name = '';
            this.name = 'title';
        }
    });
}
</script>
{% endblock %}
