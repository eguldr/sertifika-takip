{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="card shadow-lg border-0" style="border-radius: 15px;">
        <div class="card-header p-4 {% if cat == 'Arac' %}bg-warning text-dark{% elif cat == 'Personel' %}bg-info text-white{% elif cat == 'Tesis' %}bg-secondary text-white{% else %}bg-primary text-white{% endif %}" style="border-radius: 15px 15px 0 0;">
            <h3 class="mb-0">
                <i class="fas fa-plus-circle mr-2"></i> Yeni Kayıt: 
                {% if cat == 'Arac' %}Araç & Filo{% elif cat == 'Personel' %}Personel & SRC{% elif cat == 'Tesis' %}Tesis & Mekan{% else %}Üretim & Ürün{% endif %}
            </h3>
        </div>
        
        <div class="card-body p-4 bg-white">
            <form method="POST">
                <input type="hidden" name="category" value="{{ cat }}">

                <div class="row">
                    <div class="col-md-6 form-group mb-4">
                        <label class="font-weight-bold text-success"><i class="fab fa-whatsapp"></i> WhatsApp No (905...)</label>
                        <input type="text" name="whatsapp_no" class="form-control form-control-lg" placeholder="905321234567" required>
                    </div>
                    <div class="col-md-6 form-group mb-4">
                        <label class="font-weight-bold text-dark">Firma / Müşteri Adı</label>
                        <input type="text" name="firma_adi" class="form-control form-control-lg" placeholder="Firma adını yazın" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold text-dark">Belge / Sertifika Tipi Seçin (Tüm Liste)</label>
                    <select name="title" class="form-control form-control-lg" required size="12">
                        <optgroup label="⭐ BU KATEGORİ İÇİN ÖNERİLENLER">
                            {% if cat == 'Arac' %}
                                <option value="Araç Muayenesi">🚚 Araç Muayenesi</option>
                                <option value="Zorunlu Trafik Sigortası">🛡️ Zorunlu Trafik Sigortası</option>
                                <option value="Kasko Sigortası">📈 Kasko Sigortası</option>
                            {% elif cat == 'Personel' %}
                                <option value="SRC 1/2/3/4 Belgesi">🪪 SRC Belgesi</option>
                                <option value="Psikoteknik Belgesi">🧠 Psikoteknik Belgesi</option>
                            {% elif cat == 'Tesis' %}
                                <option value="Yangın Tüpü Kontrolü">🔥 Yangın Tüpü Kontrolü</option>
                                <option value="Asansör Periyodik Bakımı">🛗 Asansör Periyodik Bakımı</option>
                            {% endif %}
                        </optgroup>

                        <optgroup label="📋 TÜM SERTİFİKA KÜTÜPHANESİ">
                            <option>ACS (Sağlık Uygunluk Sertifikası)</option>
                            <option>ADR Sertifikaları</option>
                            <option>AD 2000 CODE</option>
                            <option>AS/EN/JISQ 9100</option>
                            <option>ATEX Sertifikası</option>
                            <option>BASEC Sertifikası</option>
                            <option>BENOR Sertifikası</option>

                            <option>CB Sertifikası</option>
                            <option>CCC Sertifikası</option>
                            <option>CE İşareti</option>
                            <option>CLASS Sertifikası</option>
                            <option>CMIM Mark</option>
                            <option>CMMI Dev</option>
                            <option>COSMOS Sertifikaları</option>
                            <option>Crash Test Certificate</option>
                            <option>Cradle to Cradle</option>

                            <option>EN Belgeleri</option>
                            <option>ENPLUS</option>
                            <option>Ergonomic Product</option>
                            <option>ETA</option>
                            <option>EU Type Examination</option>
                            <option>EUCERTPLAST</option>
                            <option>Free Sales Certificate</option>
                            <option>Eurovent</option>
                            <option>F4 Star</option>
                            <option>FAMI-QS</option>
                            <option>FIBC Test</option>
                            <option>Florida Product Approval</option>
                            <option>FM Approvals</option>
                            <option>FSSC 22000</option>
                            <option>G Mark</option>
                            <option>Gastec</option>

                        </optgroup>
                    </select>
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold text-dark">Plaka / TC No / Özel Not</label>
                    <input type="text" name="note" class="form-control form-control-lg" placeholder="Örn: 34 ABC 123">
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold text-danger">Belge Bitiş Tarihi</label>
                    <input type="date" name="expiry_date" class="form-control form-control-lg border-danger" required>
                </div>

                <button type="submit" class="btn btn-success btn-block btn-lg shadow-lg py-3">
                    <i class="fas fa-save mr-2"></i> Sisteme Kaydet ve Takibi Başlat
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
