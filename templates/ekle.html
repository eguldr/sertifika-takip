            <div class="mb-4">
                <label class="form-label fw-bold text-danger">Belge Bitiş Tarihi</label>
                <input type="date" name="expiry_date" class="form-control form-control-lg border-danger" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 shadow">KAYDET VE TAKİBE BAŞLA</button>
        </form>
    </div>
</div>

<script>
// Akıllı Arama Motoru (Senin listenin can damarı)
const searchInput = document.getElementById('searchInput');
if (searchInput) {
    searchInput.addEventListener('input', function() {
        const f = this.value.toUpperCase();
        document.getElementById('sertifikaSelect').querySelectorAll('option').forEach(o => {
            o.style.display = (o.text.toUpperCase().includes(f) || o.value==="") ? '' : 'none';
        });
    });
}
</script>
