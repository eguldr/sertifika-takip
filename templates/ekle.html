    <div id="otherInputDiv" class="mb-3" style="display:none;">

        <input type="text" id="otherTitleInput" class="form-control border-primary" placeholder="Örn: ÖZEL PAZAR BELGESİ">
    </div>

        <input type="date" name="expiry_date" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Kaydet</button>
    <a href="/sertifikalar?cat={{ request.args.get('cat', '') }}" class="btn btn-secondary ms-2">İptal</a>
</form>

<script>
document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toUpperCase();
    const select = document.getElementById('sertifikaSelect');
    const options = select.querySelectorAll('option');
    options.forEach(opt => {
        if (opt.value === '' || opt.value === 'Diger') {
            opt.style.display = '';
        } else if (opt.text.toUpperCase().includes(filter)) {
            opt.style.display = '';
        } else {
            opt.style.display = 'none';
        }
    });
});

document.getElementById('sertifikaSelect').addEventListener('change', function() {
    const otherDiv = document.getElementById('otherInputDiv');
    const otherInput = document.getElementById('otherTitleInput');
    if (this.value === 'Diger') {
        otherDiv.style.display = 'block';
        otherInput.required = true;
        otherInput.name = 'title';
        this.name = '';
    } else {
        otherDiv.style.display = 'none';
        otherInput.required = false;
        otherInput.name = '';
        this.name = 'title';
    }
});
</script>
