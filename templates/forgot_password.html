{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h5 class="text-center mb-4">Şifremi Unuttum</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">E-posta Adresiniz</label>
                        <input type="email" name="email" class="form-control" placeholder="E-posta giriniz" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sıfırlama Linki Gönder</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}" class="small">Giriş Sayfasına Dön</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
