{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 20px; border: none;">
        <div class="text-center mb-4">
            <div class="bg-warning d-inline-block p-3 rounded-circle text-white mb-3 shadow">
                <i class="fas fa-key fa-2x"></i>
            </div>
            <h3 class="fw-bold text-dark">Şifremi Unuttum</h3>
            <p class="text-muted small">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">E-posta Adresiniz</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="fas fa-envelope text-muted"></i>
                    </span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="ornek@firma.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-3 fw-bold shadow-sm">
                <i class="fas fa-paper-plane me-2"></i>Şifre Sıfırlama Bağlantısı Gönder
            </button>
        </form>

        <div class="text-center mt-4">
            <hr>
            <a href="{{ url_for('login') }}" class="text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i> Giriş Sayfasına Dön
            </a>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.1);
    }
</style>
{% endblock %}
