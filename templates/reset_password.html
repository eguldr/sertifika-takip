{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h5 class="text-center mb-4">Yeni Şifre Belirle</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Yeni Şifre</label>
                        <input type="password" name="password" class="form-control" placeholder="En az 6 karakter" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Şifreyi Güncelle</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
