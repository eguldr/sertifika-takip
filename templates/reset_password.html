{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius: 15px;">
                <div class="card-header bg-success text-white text-center p-4" style="border-radius: 15px 15px 0 0;">
                    <h4 class="mb-0"><i class="fas fa-key mr-2"></i> Yeni Şifre Belirle</h4>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST">
                        <div class="form-group mb-4">
                            <label class="font-weight-bold">Yeni Şifreniz</label>
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required minlength="6">
                            <small class="text-muted">En az 6 karakter olmalıdır.</small>
                        </div>
                        <button type="submit" class="btn btn-success btn-block btn-lg shadow">
                            Şifremi Güncelle
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
