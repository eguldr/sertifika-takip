{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 20px; border: none;">
        <div class="text-center mb-4">
            <div class="bg-success d-inline-block p-3 rounded-circle text-white mb-3 shadow">
                <i class="fas fa-lock fa-2x"></i>
            </div>
            <h3 class="fw-bold text-dark">Yeni Şifre Belirle</h3>
            <p class="text-muted small">Güvenliğiniz için lütfen güçlü bir şifre seçin.</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Yeni Şifreniz</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="fas fa-lock text-muted"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Yeni şifrenizi girin" required minlength="6">
                </div>
                <div class="form-text text-start">En az 6 karakter olmalıdır.</div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow-sm">
                <i class="fas fa-check-circle me-2"></i>Şifreyi Güncelle ve Sisteme Dön
            </button>
        </form>

        <div class="text-center mt-4">
            <hr>
            <p class="small text-muted mb-0">Unutmayın: Güçlü şifreler büyük/küçük harf, rakam ve özel karakter içerir.</p>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #198754;
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.1);
    }
</style>
{% endblock %}
