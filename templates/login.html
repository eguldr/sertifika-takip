{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="text-center mb-4">
            <i class="fas fa-certificate fa-3x text-primary shadow-sm p-3 bg-white rounded-circle"></i>
            <h3 class="mt-2 fw-bold text-primary">SertifikaTakip</h3>
            <p class="text-muted">Sertifikalarınızı zamanında yenileyin</p>
        </div>

        <div class="card border-0 shadow-lg" style="border-radius: 15px;">
            <div class="card-body p-4">
                <h5 class="mb-4 fw-bold text-dark">
                    <i class="fas fa-sign-in-alt me-2 text-primary"></i>Giriş Yap
                </h5>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-posta Adresi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fas fa-envelope text-muted"></i>
                            </span>
                            <input type="email" name="email" class="form-control border-start-0" placeholder="ornek@firma.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Şifre</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="******" required>
                        </div>
                    </div>

                    <div class="mb-3 text-end">
                        <a href="{{ url_for('forgot_password') }}" class="text-decoration-none small">Şifremi Unuttum?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fas fa-arrow-right-to-bracket me-2"></i>Giriş Yap
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-0 text-muted">
                        Hesabınız yok mu?
                        <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Hemen Kayıt Ol</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center mt-4 text-muted">
            <small>&copy; 2026 EG Optimal | Mevzuat ve Risk Yönetimi</small>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #1a1c4b;
        box-shadow: 0 0 0 0.25rem rgba(26, 28, 75, 0.1);
    }
    
    .btn-primary {
        background-color: #1a1c4b;
        border: none;
        transition: 0.3s;
    }
    
    .btn-primary:hover {
        background-color: #c5a059;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
