{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center mt-5">
<div class="col-md-4">
    <div class="text-center mb-4">
        <i class="fas fa-certificate fa-3x text-primary"></i>
        <h3 class="mt-2">SertifikaTakip</h3>
        <p class="text-muted">Sertifikalarınızı zamanında yenileyin</p>
    </div>
    <div class="card">
        <div class="card-body p-4">
            <h5 class="mb-4">Giriş Yap</h5>
            <div class="text-center mt-2">
    <a href="{{ url_for('forgot_password') }}" class="small text-muted">Şifremi Unuttum</a>
</div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">E-posta</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
            </form>
            <hr>
            <div class="text-center">
                <small>Hesabınız yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a></small>
            </div>
        </div>
    </div>
</div>
</div>

{% endblock %}
